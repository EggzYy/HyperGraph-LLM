\"loop_span\",\n  \"certainty\": 1.0\n}"}, {"color": "#00FF00", "id": "para_1", "label": "Paragraph 1\u2026", "shape": "square", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e section\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"Paragraph 1\",\n  \"level\": \"section\"\n}"}, {"color": "#FFFF00", "id": "sent_10", "label": "sent_10", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 0.5\u003cbr\u003e{\n  \"certainty\": 0.5,\n  \"text\": \"An AST:ALT ratio of \u003e 1.5 indicates intrahepatic (mechanical or medical) cholestasis is more likely.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#FFFF00", "id": "sent_11", "label": "sent_11", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 0.5\u003cbr\u003e{\n  \"certainty\": 0.5,\n  \"text\": \"Drug-induced cholestasis usually presents with a preferential rise in ALP, rather than GGT, or with an ALT:ALP ratio of\u003c2.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_12", "label": "sent_12", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"Causative drugs would include: antibiotics, immunosuppressants, tricyclic antidepressants and angiotensin converting enzyme inhibitors.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_13", "label": "sent_13", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"In Primary Biliary Cirrhosis, an autoimmune condition of the intrahepatic biliary ducts, the level of ALP is generally greater than that of GGT.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_14", "label": "sent_14", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"In this case, transaminases are invariably normal or only minimally elevated.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#FFFF00", "id": "sent_15", "label": "sent_15", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 0.5\u003cbr\u003e{\n  \"certainty\": 0.5,\n  \"text\": \"If either of these two criteria is absent, imaging and liver biopsy become necessary.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_16", "label": "sent_16", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"AST and ALP are used within some scoring criteria to monitor the effects of ursodeoxycholic acid in the management of PBC.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#FFFF00", "id": "sent_17", "label": "sent_17", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 0.5\u003cbr\u003e{\n  \"certainty\": 0.5,\n  \"text\": \"A recent study has shown that a raised AST:ALT ratio outperforms other non-histological indicators of cirrhosis in PBC, but still only achieves a low sensitivity and a specificity of 65-79%. As with PBC, liver enzymes play a key role in the diagnosis of Primary Sclerosing Cholangitis (PSC).\",\n  \"level\": \"sentence\"\n}"}, {"color": "#FFFF00", "id": "sent_18", "label": "sent_18", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 0.5\u003cbr\u003e{\n  \"certainty\": 0.5,\n  \"text\": \"Alcohol induces hepatic enzymes leading to a raised GGT with an ALP which may be normal, or disproportionately lower than the GGT.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_19", "label": "sent_19", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"A GGT: ALP ratio \u003e 2.5 in association with jaundice suggests alcohol as a cause of liver disease.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_2", "label": "sent_2", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"Mechanical biliary obstruction results in raised levels of ALP, GGT and often bilirubin.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_20", "label": "sent_20", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"The presence of a macrocytosis, due to either an associated dietary deficiency of folate or B12, or due to a direct suppression of bone marrow by alcohol is supportive of the diagnosis of alcoholic liver disease.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#FFFF00", "id": "sent_21", "label": "sent_21", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 0.5\u003cbr\u003e{\n  \"certainty\": 0.5,\n  \"text\": \"A raised GGT is not diagnostic of alcohol abuse, with research showing it remains high in former drinkers as well as current drinkers.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_3", "label": "sent_3", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"ALP will usually be markedly raised in comparison with ALT.s Levels of ALP and GGT elevated in similar proportions signify a hepatobiliary source.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_4", "label": "sent_4", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"Otherwise alternative causes of single enzyme elevation should be considered.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#FFFF00", "id": "sent_5", "label": "sent_5", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 0.5\u003cbr\u003e{\n  \"certainty\": 0.5,\n  \"text\": \"When due to choledocholithiasis, the levels of ALP and GGT tend to fluctuate (in comparison to stricture forming disease) and may be associated with a normal bilirubin.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#FFFF00", "id": "sent_6", "label": "sent_6", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 0.5\u003cbr\u003e{\n  \"certainty\": 0.5,\n  \"text\": \"Enzyme titres tend to rise and fall gradually and may be preceded by a peaked rise in liver transaminases which can reach \u003e 1000I/U.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_7", "label": "sent_7", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"The AST:ALT ratio (De Ritis ratio) may assist in differentiating the site of biliary obstruction.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_8", "label": "sent_8", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"When associated with a cholestatic picture, an AST:ALT ratio of \u003c1.5 suggests an extrahepatic obstruction.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#00FF00", "id": "sent_9", "label": "sent_9", "shape": "diamond", "size": 28, "title": "\u003cb\u003elevel:\u003c/b\u003e sentence\u003cbr\u003e\u003cb\u003ecertainty:\u003c/b\u003e 1.0\u003cbr\u003e{\n  \"certainty\": 1.0,\n  \"text\": \"In such circumstances the ALT titre is frequently considerably higher than AST.\",\n  \"level\": \"sentence\"\n}"}, {"color": "#1976D2", "id": "ent_29", "label": "ratio", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"ratio\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0456603\",\n      \"score\": 0.968,\n      \"definition\": \"Quotient of quantities of the same kind for different components within the same system.\",\n      \"aliases\": [\n        \"ratios\",\n        \"Ratios\",\n        \"Ratio (property) (qualifier value)\",\n        \"RATIO\",\n        \"Ratio\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C5447121\",\n      \"score\": 0.738,\n      \"definition\": \"The ratio of two concentration values.\",\n      \"aliases\": [\n        \"Ratio Concentration\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1264679\",\n      \"score\": 0.736,\n      \"definition\": \"The quotient of the mass concentration of one substance divided by the mass concentration of another substance within the same system.\",\n      \"aliases\": [\n        \"Mass ratio (property)\",\n        \"MRTO\",\n        \"Mass ratio (property) (qualifier value)\",\n        \"Mass Ratio\",\n        \"*Mass Ratio\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1264675\",\n      \"score\": 0.706,\n      \"definition\": \"The ratio of the length of time for one e ision suppression\",\n        \"Suppression (observable entity)\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0301625\",\n      \"score\": 0.982,\n      \"definition\": null,\n      \"aliases\": [\n        \"metabolic suppression\",\n        \"suppression\",\n        \"Suppression\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0728721\",\n      \"score\": 0.982,\n      \"definition\": \"conscious inhibition of an unacceptable impulse or idea.\",\n      \"aliases\": [\n        \"psychological suppression\",\n        \"suppression\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1956351\",\n      \"score\": 0.849,\n      \"definition\": \"Joint gene silencing of extra copies of genes, such as TRANSGENES, along with the original endogenous gene. Cosuppression is induced by the presence of the extra gene copies via mechanisms that are related to RNA INTERFERENCE.\",\n      \"aliases\": [\n        \"Co-Suppression\",\n        \"Cosuppression\",\n        \"Co Suppression\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0546981\",\n      \"score\": 0.815,\n      \"definition\": \"Active suspension of lactation using a medical or physical intervention.\",\n      \"aliases\": [\n        \"Suppression of lactation\",\n        \"Inhibition of lactation procedure\",\n        \"Inhibition of lactation procedure (procedure)\",\n        \"Suppressing milk\",\n        \"Lactation Suppression\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_67", "label": "Primary Sclerosing Cholangitis", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"Primary Sclerosing Cholangitis\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0566602\",\n      \"score\": 0.988,\n      \"definition\": \"A chronic, autoimmune inflammatory liver disorder characterized by narrowing and scarring of the lumen of the bile ducts. It is often seen in patients with ulcerative colitis. Signs and symptoms include jaundice, fatigue, and malabsorption. It may lead to cirrhosis and liver failure.\",\n      \"aliases\": [\n        \"Cholangitides, Primary Sclerosing\",\n        \"Primary Sclerosing Cholangitis\",\n        \"Cholangitis, Primary Sclerosing\",\n        \"Primary Sclerosing Cholangitides\",\n        \"sclerosing cholangitis\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0008313\",\n      \"score\": 0.856,\n      \"definition\": \"Chronic inflammatory disease of the BILIARY TRACT. It is characterized by fibrosis and hardening of the intrahepatic and extrahepatic biliary ductal systems leading to bile duct strictures, CHOLESTASIS, and eventual BILIARY CIRRHOSIS.\",\n      \"aliases\": [\n        \"Sclerosing Cholangitides\",\n        \"Sclerosing Cholangiitis\",\n        \"Fibrous cholangitis\",\n        \"Sclerosing cholangitis (disorder)\",\n        \"CHOLANGITIS, OBLITERATIVE, CHRONIC\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0400978\",\n      \"score\": 0.757,\n      \"definition\": \"A rare, biliary tract disease characterized by development of sclerosing cholangitis due to a known primary insult to the biliary tree, including infections, autoimmune disease, exposure to toxic agents, obstructive and ischemic injuries. Patients may be initially asymptomatic with only elevated alkaline phosphatase and gamma glutamyltransferase levels. Later presentation includes abdominal pain, jaundice, pruritus, fever and bacterial cholangitis from ascending infection.\",\n      \"aliases\": [\n        \"Secondary sclerosing cholangitis (disorder)\",\n        \"Secondary sclerosing cholangitis\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C5680117\",\n      \"score\": 0.741,\n      \"definition\": \"A rare hepatic disease characterized by the overlap of primary biliary cholangitis and/or primary sclerosing cholangitis with autoimmune hepatitis, defined by the presence of at least two of the three recognized biochemical, serological, and histological criteria of each disease. The onset of the overlapping diseases can be simultaneous or sequential, with a variable interval of up to several years. Age of onset, gender predisposition, and clinical phenotype vary between each of the diseases, and the clinical presentation ranges from asymptomatic disease or unspecific symptoms such as fatigue, arthralgia, and pruritus, to established cirrhosis and decompensation, or also acute, fulminant hepatitis and liver failure. Association with extrahepatic autoimmune diseases is common.\",\n      \"aliases\": [\n        \"PBC/PSC and AIH overlap syndrome\",\n        \"Primary biliary cholangitis and/or primary sclerosing cholangitis and autoimmune hepatitis overlap syndrome (disorder)\",\n        \"Primary biliary cholangitis/primary sclerosing cholangitis and autoimmune hepatitis overlap syndrome\",\n        \"Overlap syndrome of autoimmune liver disease\",\n        \"Overlap syndromes of autoimmune liver diseases\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_9", "label": "ALT.s\nLevels", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"ALT.s\\nLevels\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0441889\",\n      \"score\": 0.73,\n      \"definition\": \"A position on a scale measuring intensity, quality, or amount.\",\n      \"aliases\": [\n        \"Level\",\n        \"Levels\",\n        \"levels\",\n        \"Degree\",\n        \"Levels (qualifier value)\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_31", "label": "ALT titre", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"ALT titre\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0475208\",\n      \"score\": 0.787,\n      \"definition\": \"Concentration of a subs \n  \"certainty\": 1.0\n}"}, {"color": "#4DD0E1", "id": "span_1587885b_1814_1828", "label": "but still only", "shape": "ellipse", "size": 16, "title": "{\n  \"text\": \"but still only\",\n  \"label\": \"MODIFIER\",\n  \"category\": \"UNCERTAINTY\",\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_83", "label": "bone marrow", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"bone marrow\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0005953\",\n      \"score\": 0.978,\n      \"definition\": \"The soft tissue filling the cavities of bones. Bone marrow exists in two types, yellow and red. Yellow marrow is found in the large cavities of large bones and consists mostly of fat cells and a few primitive blood cells. Red marrow is a hematopoietic tissue and is the site of production of erythrocytes and granular leukocytes. Bone marrow is made up of a framework of connective tissue containing branching fibers with the frame being filled with marrow cells.\",\n      \"aliases\": [\n        \"Marrow (bone)\",\n        \"Bone marrow\",\n        \"BONE MARROW\",\n        \"Medulla ossea\",\n        \"hematopoietic marrow\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0005955\",\n      \"score\": 0.854,\n      \"definition\": \"Cells contained in the bone marrow including fat cells (see ADIPOCYTES); STROMAL CELLS; MEGAKARYOCYTES; and the immediate precursors of most blood cells.\",\n      \"aliases\": [\n        \"cell bone marrow\",\n        \"Bone Marrow Cell\",\n        \"Cells, Bone Marrow\",\n        \"Marrow Cell, Bone\",\n        \"bone marrow cells\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0729291\",\n      \"score\": 0.837,\n      \"definition\": \"Bone marrow in the rib.\",\n      \"aliases\": [\n        \"All bone marrow of a rib\",\n        \"Rib bone marrow\",\n        \"Bone marrow of rib\",\n        \"Bone Marrow, Rib\",\n        \"All bone marrow of a rib (body structure)\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_64", "label": "specificity", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"specificity\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0037791\",\n      \"score\": 0.984,\n      \"definition\": null,\n      \"aliases\": [\n        \"Specificity\",\n        \"specificity\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1511884\",\n      \"score\": 0.984,\n      \"definition\": \"The probability that a test will produce a true negative result when used on non-effected subjects as compared to a reference or \\\"gold standard\\\". The specificity of a test can be determined by calculating: number of true negative results divided by the sum of true negative results plus number of false positive results.\",\n      \"aliases\": [\n        \"Specificity of Diagnostic Test\",\n        \"Diagnostic Specificity\",\n        \"Specificity\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0037783\",\n      \"score\": 0.878,\n      \"definition\": \"The restriction of a characteristic behavior, anatomical structure or physical system, such as immune response; metabolic response, or gene or gene variant to the members of one species. It refers to that property which differentiates one species from another but it is also used for phylogenetic levels higher or lower than the species.\",\n      \"aliases\": [\n        \"Species Specificities\",\n        \"Specificity, Species\",\n        \"Specificities, Species\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C2936412\",\n      \"score\": 0.842,\n      \"definition\": \"The properties of a pathogen that makes it capable of infecting one or more specific hosts. The pathogen can include PARASITES as well as VIRUSES; BACTERIA; FUNGI; or PLANTS.\",\n      \"aliases\": [\n        \"Host Species Specificities\",\n        \"Specificity, Host Species\",\n        \"Specificities, Host\",\n        \"Specificities, Host Species\",\n        \"Host Species Specificity\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0029213\",\n      \"score\": 0.817,\n      \"definition\": \"Characteristic restricted to a particular organ of the body, such as a cell type, metabolic response or expression of a particular protein or antigen.\",\n      \"aliases\": [\n        \"Specificity, Organ\",\n        \"Organ Specificities\",\n        \"Specificities, Organ\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_60", "label": "histological indicators", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"histological indicators\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0205462\",\n      \"score\": 0.738,\n      \"definition\": \"Pertaining to the combined microscopic physical features of cells and their surrounding extracellular environment in tissues.\",\n      \"aliases\": [\n        \"Histological\",\n        \"Histologically\",\n        \"Histologic (qualifier value)\",\n        \"Histologic\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C2987065\",\n      \"score\": 0.715,\n      \"definition\": \"An indication as to whether there is a relationship to an individual\u0027s medical history.\",\n      \"aliases\": [],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_79", "label": "dietary deficiency", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"dietary deficiency\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0162429\",\n      \"score\": 0.986,\n      \"definition\": \"An imbalanced nutritional status resulting from insufficient intake of nutrients to meet normal physiological requirement.\",\n      \"aliases\": [\n        \"nutritional deficiency\",\n        \"deficiencies nutritional\",\n        \"Malnutrition NOS\",\n        \"nutritional deficiencies\",\n        \"Acquired deficiency\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C4761312\",\n      \"score\": 0.986,\n      \"definition\": \"A deficiency of a necessary nutrient.\",\n      \"aliases\": [\n        \"Nutritional deficiency disorder (disorder)\",\n        \"Nutritional deficiency finding\",\n        \"Nutritional deficiency state\",\n        \"nutritional deficiency\",\n        \"Nutritional deficiency, NOS\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1623416\",\n      \"score\": 0.759,\n      \"definition\": \"Used with endogenous and exogenous substances which are absent or in diminished amount relative to the normal requirement of an organism or a biologic system.\",\n      \"aliases\": [\n        \"deficiency\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C4331349\",\n      \"score\": 0.738,\n      \"definition\": \"Congenital lipoid adrenal hyperplasia (CLAH) due to loss-of-function mutations in the STAR gene, resulting in decreased or absent production of steroidogenic acute regulatory protein (StAR), which leads to deficient transport of cholesterol from the outer to the inner mitochondrial membrane.\",\n      \"aliases\": [\n        \"StAR Deficiency\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0039585\",\n      \"score\": 0.716,\n      \"definition\": \"A disorder of sexual development transmitted as an X-linked recessive trait. These patients have a karyotype of 46,XY with end-organ resistance to androgen due to mutations in the androgen receptor (RECEPTORS, ANDROGEN) gene. Severity of the defect in receptor quantity or quality correlates with their phenotypes. In these genetic males, the phenotypic spectrum ranges from those with normal female external genitalia, through those with genital ambiguity as in Reifenstein Syndrome, to that of a normal male with INFERTILITY.\",\n      \"aliases\": [\n        \"Androgen Resistance Syndromes\",\n        \"DIHYDROTESTOSTERONE RECEPTOR DEFICIENCY\",\n        \"Morris syndrome\",\n        \"ANDROGEN RECEPTOR DEFICIENCY\",\n        \"TESTICULAR FEMINIZATION SYNDROME\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_45", "label": "Primary Biliary Cirrhosis", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"Primary Biliary Cirrhosis\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0008312\",\n      \"score\": 0.98,\n      \"definition\": \"An autoimmune inflammatory disorder characterized by destruction of the small intrahepatic bile ducts. It affects predominantly females and it may lead to cirrhosis and liver failure. Patients have antimitochondrial and antinuclear antibodies in the peripheral blood.\",\n      \"aliases\": [\n        \"PRIMARY BILIARY CIRRHOSIS\",\n        \"Primary biliary cholangitis (disorder)\",\n        \"primary biliary cirrhosis\",\n        \"Primary Biliary Cirrhosis\",\n        \"Chronic non-suppurative destructive cholangitis\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0023892\",\n      \"score\": 0.832,\n      \"definition\": \"FIBROSIS of the hepatic parenchyma due to obstruction of BILE flow (CHOLESTASIS) in the intrahepatic or extrahepatic bile ducts (BILE DUCTS, INTRAHEPATIC; BILE DUCTS, EXTRAHEPATIC). Primary biliary cholangitis involves the destruction of small intra-hepatic bile ducts and decreased bile secretion. Secondary biliary cholangitis is produced by prolonged obstruction of large intrahepatic or extrahepatic bile ducts from a variety of causes.\",\n      \"aliases\": [\n        \"cirrhosis biliary\",\n        \"BILIARY CIRRHOSIS\",\n        \"Biliary cirrhosis\",\n        \"Cirrhosis, Biliary\",\n        \"Liver Cirrhoses, Biliary\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0748397\",\n      \"score\": 0.759,\n      \"definition\": \"An autoimmune disorder characterised by the association of primary biliary cirrhosis with limited cutaneous systemic sclerosis. Onset occurs between 30-65 years. Occurs sporadically, but rare familial cases with an unknown inheritance pattern have been observed. There is no cure and management is mainly supportive.\",\n      \"aliases\": [\n        \"Primary biliary cirrhosis co-occurrent with systemic scleroderma (disorder)\",\n        \"PRIMARY BILIARY CIRRHOSIS, SCLERODERMA, RAYNAUD DISEASE, AND TELANGIECTASIA\",\n        \"REYNOLDS SYNDROME\",\n        \"Reynolds syndrome\",\n        \"Primary biliary cirrhosis and systemic scleroderma\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0238065\",\n      \"score\": 0.757,\n      \"definition\": \"Biliary cirrhosis due to obstruction of the extrahepatic ducts.\",\n      \"aliases\": [\n        \"Secondary Biliary Cirrhosis\",\n        \"Liver Cirrhosis, Obstructive\",\n        \"CIRRHOSIS, SECONDARY BILIARY\",\n        \"BILIARY CIRRHOSIS SECONDARY\",\n        \"Obstructive Liver Cirrhosis\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_10", "label": "elevated", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"elevated\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0205250\",\n      \"score\": 0.978,\n      \"definition\": \"An elevated level or position or degree; greater than normal in degree or intensity or amount.\",\n      \"aliases\": [\n        \"High\",\n        \"elevate\",\n        \"Highly\",\n        \"high\",\n        \"elevated\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C3163633\",\n      \"score\": 0.978,\n      \"definition\": \"Raised or increased above normal levels or limits.\",\n      \"aliases\": [\n        \"Elevated\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0520886\",\n      \"score\": 0.907,\n      \"definition\": \"An electrocardiographic finding of ST segment elevation above the baseline.\",\n      \"aliases\": [\n        \"ST SEGMENT ELEVATED\",\n        \"st elevated\",\n        \"elevation st\",\n        \"st segment elevation\",\n        \"st elevation ekg\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0151904\",\n      \"score\": 0.863,\n      \"definition\": \"An increase in the level of aspartate aminotransferase in the blood.\",\n      \"aliases\": [\n        \"SGOT, ELEVATED\",\n        \"ast elevated\",\n        \"GLUTAMIC-OXALOACETIC TRANSAM INCR\",\n        \"Elevated serum AST\",\n        \"AST INCREASED\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0221106\",\n      \"score\": 0.856,\n      \"definition\": \"An abnormally high blood pH (usually defined as 7.41 or above). [PMID:24381489]\",\n      \"aliases\": [\n        \"increase ph\",\n        \"Acid deficit\",\n        \"Baseosis\",\n        \"increasing ph\",\n        \"ELEVATED PH\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_54", "label": "scoring criteria", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"scoring criteria\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0243161\",\n      \"score\": 0.714,\n      \"definition\": \"That which constitutes a standard from which a judgment can be established, a reference point against which other things can be evaluated, or a basis for comparison.\",\n      \"aliases\": [\n        \"Criteria\",\n        \"Criterion\",\n        \"criterion\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_23", "label": "ALT ratio", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"ALT ratio\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0456603\",\n      \"score\": 0.766,\n      \"definition\": \"Quotient of quantities of the same kind for different components within the same system.\",\n      \"aliases\": [\n        \"ratios\",\n        \"Ratios\",\n        \"Ratio (property) (qualifier value)\",\n        \"RATIO\",\n        \"Ratio\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#4DD0E1", "id": "span_1587885b_534_549", "label": "may be preceded", "shape": "ellipse", "size": 16, "title": "{\n  \"text\": \"may be preceded\",\n  \"label\": \"MODIFIER\",\n  \"category\": \"POSSIBLE_EXISTENCE\",\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_72", "label": "disproportionately", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"disproportionately\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0426415\",\n      \"score\": 0.8,\n      \"definition\": \"Distance between subnasale and pronasale more than two standard deviations above the mean, or alternatively, an apparently increased anterior protrusion of the nasal tip. [PMID:19152422]\",\n      \"aliases\": [\n        \"Big nose\",\n        \"Increased size of nose\",\n        \"Large nose (finding)\",\n        \"Increased nasal size\",\n        \"Prominent nose\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1849075\",\n      \"score\": 0.777,\n      \"definition\": \"Head circumference is less than two standard deviations above the mean, but appears disproportionately large when other factors such as stature are considered.\",\n      \"aliases\": [\n        \"Disproportionately large head\",\n        \"Relative macrocephaly (finding)\",\n        \"Macrocephaly, relative\",\n        \"Relatively large head\",\n        \"Relative macrocephaly\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1848109\",\n      \"score\": 0.767,\n      \"definition\": \"Disproportionately long fibulae. [HPO:probinson]\",\n      \"aliases\": [\n        \"Disproportionately long fibulae\",\n        \"Long fibulae\",\n        \"Long calf bone\",\n        \"Long fibula\",\n        \"Disproportionately long fibula\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1848108\",\n      \"score\": 0.754,\n      \"definition\": \"Increased length of the ulna. [HPO:probinson]\",\n      \"aliases\": [\n        \"Long ulnae\",\n        \"Disproportionately long ulnae\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0576225\",\n      \"score\": 0.752,\n      \"definition\": \"Increased back to front length of the foot. [UHPO:probinson]\",\n      \"aliases\": [\n        \"Long foot\",\n        \"Long feet\",\n        \"large feet\",\n        \"Disproportionately large feet\",\n        \"Large feet\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_43", "label": "antidepressants", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"antidepressants\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0003289\",\n      \"score\": 0.977,\n      \"definition\": \"Mood-stimulating drugs used primarily in the treatment of affective disorders and related conditions. Several MONOAMINE OXIDASE INHIBITORS are useful as antidepressants apparently as a long-term consequence of their modulation of catecholamine levels. The tricyclic compounds useful as antidepressive agents (ANTIDEPRESSIVE AGENTS, TRICYCLIC) also appear to act through brain catecholamine systems. A third group (ANTIDEPRESSIVE AGENTS, SECOND-GENERATION) is a diverse group of drugs including some that act specifically on serotonergic systems.\",\n      \"aliases\": [\n        \"antidepressive agent\",\n        \"Antidepressive Agent [TC]\",\n        \"Antidepressant\",\n        \"Antidepressant Drugs\",\n        \"ANTIDEPRESSANTS\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0242905\",\n      \"score\": 0.794,\n      \"definition\": \"A structurally and mechanistically diverse group of drugs that are not tricyclics or monoamine oxidase inhibitors. The most clinically important appear to act selectively on serotonergic systems, especially by inhibiting serotonin reuptake.\",\n      \"aliases\": [\n        \"Antidepressive Agents, Second Generation\",\n        \"Antidepressive Drugs, Second-Generation\",\n        \"Agents, Second-Generation Antidepressive\",\n        \"Second Generation Antidepressive Agents\",\n        \"Second-Generation Antidepressive Agents\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0003290\",\n      \"score\": 0.775,\n      \"definition\": \"Substances that contain a fused three-ring moiety and are used in the treatment of depression. These drugs block the uptake of norepinephrine and serotonin into axon terminals and may block some subtypes of serotonin, adrenergic, and histamine receptors. However, the mechanism of their antidepressant effects is not clear because the therapeutic effects usually take weeks to develop and may reflect compensatory changes in the central nervous system.\",\n      \"aliases\": [\n        \"Tricyclic Antidepressants\",\n        \"Antidepressant Drugs, Tricyclic\",\n        \"Antidepressive Agents, Tricyclic\",\n        \"tricyclic antidepressants\",\n        \"Drugs, Tricyclic Antidepressant\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_50", "label": "criteria", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"criteria\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0243161\",\n      \"score\": 0.977,\n      \"definition\": \"That which constitutes a standard from which a judgment can be established, a reference point against which other things can be evaluated, or a basis for comparison.\",\n      \"aliases\": [\n        \"Criteria\",\n        \"Criterion\",\n        \"criterion\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C3897119\",\n      \"score\": 0.794,\n      \"definition\": \"An update to the MacDonald criteria for assessing disease progression and treatment response in glioblastoma multiforme (GBM).\",\n      \"aliases\": [\n        \"RANO\",\n        \"RANO Response Criteria\",\n        \"Response Assessment Criteria for Glioblastoma\",\n        \"RANO Criteria\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C4744412\",\n      \"score\": 0.79,\n      \"definition\": \"A validated risk prediction tool for patients with metastatic renal cell carcinoma (mRCC) receiving first-line targeted therapy. The model considers: Karnofsky performance status less than 80%, time from diagnosis to first-line targeted therapy less than 1 year, hemoglobin concentration less than lower limit of normal, neutrophil count greater than upper limit of normal, platelet count greater than upper limit of normal, and serum calcium concentration greater than upper limit of normal.\",\n      \"aliases\": [\n        \"Heng Criteria\",\n        \"IMDC Criteria\",\n        \"IMDC Risk\",\n        \"IMDC\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C3897634\",\n      \"score\": 0.744,\n      \"definition\": \"A standard from which a judgment concerning an event severity can be established.\",\n      \"aliases\": [],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C4330479\",\n      \"score\": 0.726,\n      \"definition\": \"Response assessment criteria for the evaluation of patients undergoing immunotherapy for the treatment of malignant glioma. These recommendations integrate guidance for the determination and confirmation of tumor progression based on the response assessment in neuro-oncology (RANO) working group and the immune-related response criteria (irRC).\",\n      \"aliases\": [\n        \"iRANO\",\n        \"iRANO Criteria\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_66", "label": "diagnosis", "shape": "dot", "size": 16, "title": "{\n  \"text\": \ : 1.0\n}"}, {"color": "#1976D2", "id": "ent_30", "label": "extrahepatic obstruction", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"extrahepatic obstruction\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0005398\",\n      \"score\": 0.847,\n      \"definition\": \"Impairment of bile flow in the large BILE DUCTS by mechanical obstruction or stricture due to benign or malignant processes.\",\n      \"aliases\": [\n        \"Extrahepatic cholestasis\",\n        \"cholestasis extrahepatic\",\n        \"Biliary Stasis, Extrahepatic\",\n        \"extrahepatic cholestasis\",\n        \"Extrahepatic Bile Duct Obstruction\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0019154\",\n      \"score\": 0.737,\n      \"definition\": \"An obstruction in the veins of the liver caused by a blood clot (thrombosis). [HPO:probinson]\",\n      \"aliases\": [\n        \"budd chiari\u0027s syndrome\",\n        \"chiari\u0027s syndrome\",\n        \"Hepatic vein thrombosis (disorder)\",\n        \"Hepatic Vein Thrombosis\",\n        \"budd chiari syndrome\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0008372\",\n      \"score\": 0.709,\n      \"definition\": \"Impairment of bile flow due to injury to the HEPATOCYTES; BILE CANALICULI; or the intrahepatic bile ducts (BILE DUCTS, INTRAHEPATIC).\",\n      \"aliases\": [\n        \"Cholestasis, Intrahepatic\",\n        \"CHOLESTASIS INTRAHEPATIC\",\n        \"Bile Duct Obstruction, Intrahepatic\",\n        \"Intrahepatic Biliary Stasis\",\n        \"Intrahepatic Biliary Stases\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_81", "label": "B12", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"B12\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0042845\",\n      \"score\": 0.989,\n      \"definition\": \"A cobalt-containing coordination compound produced by intestinal micro-organisms and found also in soil and water. Higher plants do not concentrate vitamin B 12 from the soil and so are a poor source of the substance as compared with animal tissues. INTRINSIC FACTOR is important for the assimilation of vitamin B 12.\",\n      \"aliases\": [\n        \"Cyanocobalamin preparation\",\n        \"Product containing cyanocobalamin (medicinal product)\",\n        \"Vitamin B12\",\n        \"Vitamin B-12\",\n        \"Cyanocob(III)alamin\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1417635\",\n      \"score\": 0.989,\n      \"definition\": null,\n      \"aliases\": [\n        \"NDUFB3 gene\",\n        \"NADH:ubiquinone oxidoreductase subunit B3\",\n        \"B12\",\n        \"NADH-UBIQUINONE OXIDOREDUCTASE SUBUNIT B3\",\n        \"NADH dehydrogenase (ubiquinone) 1 beta subcomplex, 3, 12kDa\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1420797\",\n      \"score\": 0.989,\n      \"definition\": \"This gene plays a role in the regulation of protein ubiquitination.\",\n      \"aliases\": [\n        \"BTBD34\",\n        \"MGC2317\",\n        \"TUMOR NECROSIS FACTOR-ALPHA-INDUCED PROTEIN 1\",\n        \"TUMOR NECROSIS FACTOR-ALPHA-INDUCED PROTEIN, ENDOTHELIAL\",\n        \"EDP1\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C3538796\",\n      \"score\": 0.989,\n      \"definition\": \"Human TNFAIP1 wild-type allele is located within 17q22-q23 and is approximately 11 kb in length. This allele, which encodes BTB/POZ domain-containing adapter for CUL3-mediated RhoA degradation protein 2, is involved in the modulation of the ubiquitination of transforming protein RhoA.\",\n      \"aliases\": [\n        \"BTBD34\",\n        \"MGC2317\",\n        \"BACURD2\",\n        \"EDP1\",\n        \"hBACURD2\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0086024\",\n      \"score\": 0.795,\n      \"definition\": \"An essential nutrient and natural water-soluble vitamin of the B-complex family that must combine with an intrinsic factor for absorption by the intestine, Vitamin B12 (cyanocobalamin) is necessary for hematopoiesis, neural metabolism, DNA and RNA production, and carbohydrate, fat, and protein metabolism. B12 improves iron functions in the metabolic cycle and assists folic acid in choline synthesis. B12 metabolism is interconnected with that of folic acid. Vitamin B12 deficiency causes pernicious anemia, megaloblastic anemia, and neurologic lesions.\",\n      \"aliases\": [\n        \"vit B12\",\n        \"Cobalamin preparation, NOS\",\n        \"B12 Vitamin\",\n        \"Vitamin-B12\",\n        \"cobalamin\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_53", "label": "liver biopsy", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"liver biopsy\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0193388\",\n      \"score\": 0.973,\n      \"definition\": \"Removal of tissue from the liver for microscopic examination.\",\n      \"aliases\": [\n        \"liver biopsy procedure\",\n        \"Biopsy of liver\",\n        \"Liver biopsy\",\n        \"Biopsy of liver, NOS\",\n        \"Liver Biopsy\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1548877\",\n      \"score\": 0.973,\n      \"definition\": null,\n      \"aliases\": [\n        \"Liver Biopsy\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0879184\",\n      \"score\": 0.745,\n      \"definition\": \"Vascular catheters designed for the removal of tissue from the liver through the vascular system. These catheters typically consist of a 9 Fr plastic tube with a biopsy needle that is advanced through its lumen; the needle frequently includes a hollow stylet within it to prevent aspiration of the sample into the syringe. They are usually introduced through the jugular vein, advanced to the inferior vena cava, and to the hepatic veins; the needle is plunged into the liver and removed in one continuous motion while suction is maintained with a syringe. Contrast medium should be injected after each biopsy attempt to check for liver capsule perforation. Liver biopsy catheters through the vascular system are used as an alternative to percutaneous biopsy in patients with abnormal blood clotting or massive ascites.\",\n      \"aliases\": [\n        \"Liver Biopsy Catheters\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0558534\",\n      \"score\": 0.744,\n      \"definition\": \"The extraction of a sample of liver tissue taken via the insertion of a needle through the skin and into the liver.\",\n      \"aliases\": [\n        \"Percutaneous liver biopsy (procedure)\",\n        \"Percutaneous Liver Biopsy\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0581276\",\n      \"score\": 0.732,\n      \"definition\": \"Removal of tissue from the liver for microscopic examination, using a needle.\",\n      \"aliases\": [\n        \"Needle Biopsy of Liver\",\n        \"Needle biopsy of liver (procedure)\",\n        \"liver biopsy needle\",\n        \"Needle biopsy of liver\",\n        \"liver needle biopsy\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_46", "label": "autoimmune condition", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"autoimmune condition\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0004364\",\n      \"score\": 0.961,\n      \"definition\": \"Disorders that are characterized by the production of antibodies that react with host tissues or immune effector cells that are autoreactive to endogenous peptides.\",\n      \"aliases\": [\n        \"AUTOIMMUNE DISORDER NOS\",\n        \"autoimmunities\",\n        \"Autoimmune Disease\",\n        \"Autoimmune Disorder\",\n        \"autoimmunity\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \" ical outcome of a particular disease. (From Hosp Pharm 1995 Jul;30(7):596)\",\n      \"aliases\": [\n        \"Management, Disease\",\n        \"management\",\n        \"Disease management\",\n        \"disease management\",\n        \"Disease Managements\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1273870\",\n      \"score\": 0.977,\n      \"definition\": \"The act of conducting, controlling or supervising something.\",\n      \"aliases\": [\n        \"Supervision\",\n        \"Management procedure\",\n        \"Managing\",\n        \"Oversight\",\n        \"management procedures\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C3273539\",\n      \"score\": 0.977,\n      \"definition\": \"A class of professional or vocational positions of employment that involve management.\",\n      \"aliases\": [\n        \"Management\",\n        \"Management Occupations\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C2735310\",\n      \"score\": 0.842,\n      \"definition\": \"\u003cp\u003eTo perform analytics, evaluation and other secondary uses of treatment and healthcare related information to manage the quality, efficacy, patient safety, population health, and cost effectiveness of healthcare delivery. Explicitly excludes the use of information to organize the delivery of health care for care coordination and case management, or to provide healthcare treatment.\u003c/p\u003e\u003ci\u003eUsage Note:\u003c/i\u003eThe concept of care management is narrower than the list of activities related to more general organizational objectives such as provider profiling, education of healthcare and non-healthcare professionals; insurance underwriting, premium rating, reinsurance; organizational legal, medical review, auditing, compliance and fraud and abuse detection; business planning, development, and restructuring; fund-raising; and customer service.\u003ci\u003eMap:\u003c/i\u003eMaps to ISO 14265 Classification  negligible, and mitigations are in place to address reidentification risk.\u003c/p\u003e\u003ci\u003eUsage Note:\u003c/i\u003e\u003cp\u003eThe level of protection afforded anonymized and pseudonymized, and non-personally identifiable information (e.g., a limited data set) is dictated by privacy policies and data use agreements intended to engender trust that health information can be used and disclosed with little or no risk of re-identification.\u003c/p\u003e\u003cb\u003eExample:\u003c/b\u003ePersonal and healthcare information, which excludes 16 designated categories of direct identifiers in a HIPAA Limited Data Set. This information may be disclosed by HIPAA Covered Entities without patient authorization for a research, public health, and operations purposes if conditions are met, which includes obtaining a signed data use agreement from the recipient. See 45 CFR Section 164.514.\u003cp\u003eThis metadata indicates that the receiver may have an obligation to comply with a data use agreement with the discloser. The discloser may have obligations to comply with policies dictating the methods for de-identification.\u003c/p\u003eConfidentiality code total order hierarchy: Low (L) is less protective than\u003ci\u003eV, R, N,\u003c/i\u003eand *M*, and subsumes *U*.\",\n      \"aliases\": [\n        \"low\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1611820\",\n      \"score\": 0.994,\n      \"definition\": \"\u003cp\u003eThe result for a quantitative observation is below the lower limit of the reference range (as defined for the respective test procedure).\u003c/p\u003e\u003cp\u003eSynonym: Below low normal\u003c/p\u003e\",\n      \"aliases\": [\n        \"Low\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C1619811\",\n      \"score\": 0.994,\n      \"definition\": \"\u003cp\u003eIndicates that the receiver has messages for the sender\u003c/p\u003e\u003ci\u003eOpenIssue:\u003c/i\u003eDescription does not make sense re age. [HPO:probinson]\",\n      \"aliases\": [\n        \"Elevated liver transaminases\",\n        \"Elevated hepatic transaminases\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0002484\",\n      \"score\": 0.713,\n      \"definition\": \"Enzymes of a subclass of TRANSFERASES that catalyze the transfer of an amidino group from donor to acceptor. EC 2.1.4.\",\n      \"aliases\": [\n        \"amidinotransferase\",\n        \"Transamidinases\",\n        \"Amidinotransferase\",\n        \"Transamidinase\",\n        \"Amidinotransferases\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0004002\",\n      \"score\": 0.709,\n      \"definition\": \"Enzymes of the transferase class that catalyze the conversion of L-aspartate and 2-ketoglutarate to oxaloacetate and L-glutamate. EC 2.6.1.1.\",\n      \"aliases\": [\n        \"s-asat\",\n        \"Glutamic oxaloacetic transaminase (GOT)\",\n        \"Aspartate Aminotransferases\",\n        \"glutamic oxaloacetic transaminase\",\n        \"Glutamic Oxaloacetic Transaminase\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C4507520\",\n      \"score\": 0.709,\n      \"definition\": \"Aspartate aminotransferase, cytoplasmic (413 aa, ~46 kDa) is encoded by the human GOT1 gene. This protein is involved in amino acid metabolism.\",\n      \"aliases\": [\n        \"GOT1 protein, human\",\n        \"Soluble Glutamic-Oxaloacetic Transaminase 1\",\n        \"Transaminase A\",\n        \"Glutamate Oxaloacetate Transaminase-1\",\n        \"Aspartate Aminotransferase, Cytoplasmic\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_36", "label": "cholestasis", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"cholestasis\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0008370\",\n      \"score\": 0.992,\n      \"definition\": \"Impairment of bile flow due to obstruction in small bile ducts zyme Inhibitor\",\n        \"Angiotensin-converting enzyme inhibitor agent, NOS\",\n        \"angiotensin converting enzyme inhibitor\",\n        \"ace inhibitors\",\n        \"ace inhibitor\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0919881\",\n      \"score\": 0.834,\n      \"definition\": \"Fetal embryopathy associated with maternal angiotensis converting enzyme (ACE) inhibitor use during pregnancy that may include fetal acute renal failure, growth restriction, oligohydramnios, calvaria abnormalities, preterm birth, and pulmonary hypoplasia with respiratory distress.\",\n      \"aliases\": [\n        \"ACE Inhibitor Fetopathy\"\n      ],\n      \"snomed_ids\": []\n    },\n    {\n      \"cui\": \"C0022709\",\n      \"score\": 0.833,\n      \"definition\": \"A peptidyl-dipeptidase that catalyzes the release of a C-terminal dipeptide, oligopeptide-\u0026#x7C;-Xaa-Yaa, when Xaa is not Pro, and Yaa is neither Asp nor Glu. Thus, conversion of ANGIOTENSIN I to ANGIOTENSIN II, with increase in vasoconstrictor activity, but no action on angiotensin II. It is also able to inactivate BRADYKININ, a potent vasodilator; and has a glycosidase activity which releases GPI-anchored proteins from the membrane by cleaving the mannose linkage in the GPI moiety. (From https://www.uniprot.org April 15, 2020).\",\n      \"aliases\": [\n        \"angiotensin i converting enzyme\",\n        \"Angiotensin converting enzyme\",\n        \"Dipeptidyl carboxypeptidase I\",\n        \"angiotensin converting enzymes\",\n        \"Angiotensin Converting Enzyme\"\n      ],\n      \"snomed_ids\": []\n    }\n  ],\n  \"certainty\": 1.0\n}"}, {"color": "#1976D2", "id": "ent_84", "label": "alcoholic liver disease", "shape": "dot", "size": 16, "title": "{\n  \"text\": \"alcoholic liver disease\",\n  \"label\": \"ENTITY\",\n  \"umls\": [\n    {\n      \"cui\": \"C0023896\",\n      \"score\": 0.978,\n      \"definition\": \"Liver diseases associated with ALCOHOLISM. It usually
